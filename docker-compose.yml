services:
  codex-usage:
    build:
      context: .
    image: ${IMAGE:-wipoohyam/codex-usage-telegram:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CODEX_HOME: /home/node/.codex
      STATE_FILE: /app/data/state.json
    volumes:
      - codex-auth:/home/node/.codex
      - codex-usage-data:/app/data

volumes:
  codex-auth:
  codex-usage-data:
